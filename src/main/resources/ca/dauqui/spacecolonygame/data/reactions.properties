# ==============================================================================
# SPACE COLONY GAME - ATMOSPHERIC CHEMICAL REACTION MATRIX
# FILE ENCODING REQUIREMENT: UTF-8
# ==============================================================================

# --- 1. HYDROGEN + OXYGEN COMBUSTION -> WATER ---
# Generates oceans and cloud layers on hot or volcanically active worlds
HYDROGEN_OXYGEN_COMBUSTION.reactants = HYDROGEN:2, OXYGEN:1
HYDROGEN_OXYGEN_COMBUSTION.products = VAPOR_WATER:2
HYDROGEN_OXYGEN_COMBUSTION.minTemp = 450.0
HYDROGEN_OXYGEN_COMBUSTION.minPartialPressures = HYDROGEN:0.02, OXYGEN:0.01
HYDROGEN_OXYGEN_COMBUSTION.reactionRate = 0.25

# --- 2. HYDROGEN CHLORIDE SYNTHESIS (HYDROGEN + CHLORINE) ---
# Converts free hydrogen and chlorine into ultra-corrosive acid vapour
HYDROGEN_CHLORINE_SYNTHESIS.reactants = HYDROGEN:1, CHLORINE:1
HYDROGEN_CHLORINE_SYNTHESIS.products = HYDROGEN_CHLORIDE:2
HYDROGEN_CHLORINE_SYNTHESIS.minTemp = 250.0
HYDROGEN_CHLORINE_SYNTHESIS.minPartialPressures = HYDROGEN:0.005, CHLORINE:0.005
HYDROGEN_CHLORINE_SYNTHESIS.reactionRate = 0.40

# --- 3. METHANE OXIDATION (METHANE + OXYGEN -> CO2 + WATER) ---
# Depletes atmospheric methane when oxygen is introduced on temperate or hot worlds
METHANE_OXIDATION.reactants = METHANE:1, OXYGEN:2
METHANE_OXIDATION.products = CARBON_DIOXIDE:1, VAPOR_WATER:2
METHANE_OXIDATION.minTemp = 350.0
METHANE_OXIDATION.minPartialPressures = METHANE:0.01, OXYGEN:0.02
METHANE_OXIDATION.reactionRate = 0.15

# --- 4. AMMONIA OXIDATION (AMMONIA + OXYGEN -> NITROGEN + WATER) ---
# Enables terraforming toxic ammonia worlds into breathable nitrogen atmospheres
AMMONIA_OXIDATION.reactants = AMMONIA:4, OXYGEN:3
AMMONIA_OXIDATION.products = NITROGEN:2, VAPOR_WATER:6
AMMONIA_OXIDATION.minTemp = 300.0
AMMONIA_OXIDATION.minPartialPressures = AMMONIA:0.01, OXYGEN:0.01
AMMONIA_OXIDATION.reactionRate = 0.20

# --- 5. AMMONIA + HYDROGEN CHLORIDE NEUTRALIZATION -> AMMONIUM CHLORIDE SALT ---
# Neutralizes two lethal toxic gases into a solid mineral salt that precipitates to the ground
AMMONIA_ACID_NEUTRALIZATION.reactants = AMMONIA:1, HYDROGEN_CHLORIDE:1
AMMONIA_ACID_NEUTRALIZATION.products = AMMONIUM_CHLORIDE:1
AMMONIA_ACID_NEUTRALIZATION.minTemp = 150.0
AMMONIA_ACID_NEUTRALIZATION.minPartialPressures = AMMONIA:0.001, HYDROGEN_CHLORIDE:0.001
AMMONIA_ACID_NEUTRALIZATION.reactionRate = 0.50

# --- 6. SULFUR DIOXIDE OXIDATION -> SULFUR TRIOXIDE ---
# Allows scrubbing volcanic sulfur dioxide using oxygen to trigger heavy acid condensation
SULFUR_OXIDATION.reactants = SULFUR_DIOXIDE:2, OXYGEN:1
SULFUR_OXIDATION.products = SULFUR_TRIOXIDE:2
SULFUR_OXIDATION.minTemp = 300.0
SULFUR_OXIDATION.minPartialPressures = SULFUR_DIOXIDE:0.01, OXYGEN:0.02
SULFUR_OXIDATION.reactionRate = 0.15

# --- 7. HIGH-TEMPERATURE METHANE STEAM REFORMING ---
# Breaks down methane in extreme heat into carbon dioxide and free hydrogen
METHANE_STEAM_REFORMING.reactants = METHANE:1, VAPOR_WATER:2
METHANE_STEAM_REFORMING.products = CARBON_DIOXIDE:1, HYDROGEN:4
METHANE_STEAM_REFORMING.minTemp = 700.0
METHANE_STEAM_REFORMING.minPartialPressures = METHANE:0.02, VAPOR_WATER:0.02
METHANE_STEAM_REFORMING.reactionRate = 0.20