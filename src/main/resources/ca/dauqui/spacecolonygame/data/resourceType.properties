# contains all the resources types available in the game
# for naturally occurring resource, will also list the information necessary to be generated in the map
# NAME.id NAME is mandatory for all resource, also dont forget to update the localization files
# NAME.naturallyOccurring is false by default
#These next attributes will be used only when naturallyOccurring is true
# NAME.minPerSite is defaulted at 0
# NAME.appearsOn is defaulted to HARD
# available values : EASY, NORMAL, HARD
#
# Advanced Mathematical Generation parameters (multifactorial curves) :
# NAME.influences.ATTRIBUTE.type is the mathematical model to apply.
# Available models: LINEAR, PARABOLIC, SIGMOID, POLYNOMIAL
# Available planet ATTRIBUTE: VOLCANISM, PRESSURE, TECTONIC, GRAVITY
#
# NAME.influences.ATTRIBUTE.params lists the continuous parameters required by the type:
#   - LINEAR     : slope, intercept                   -> y = ax + b
#   - PARABOLIC  : coeff_a, coeff_b, coeff_c          -> y = ax² + bx + c
#   - SIGMOID    : max_limit, slope_k, x0_inflection  -> y = L / (1 + e^(-k(x-x0)))
#   - POLYNOMIAL : c0, c1, c2, c3...                  -> y = c0 + c1*x + c2*x² + c3*x³...
# NOTE: The final calculated mathematical score will act as a multiplier
# for both the number of veins AND the richness (amount) of the resources inside.

ORE_A.naturallyOccurring = true
ORE_A.minPerSite = 3
ORE_A.appearsOn = EASY, NORMAL
ORE_A.baseMinAmount = 500
ORE_A.baseMaxAmount = 1500
ORE_A.influences.GRAVITY.type = LINEAR
ORE_A.influences.GRAVITY.params = 2.0, 0.0

ORE_B.naturallyOccurring = true
ORE_B.minPerSite = 2
ORE_B.appearsOn = NORMAL, HARD
ORE_B.baseMinAmount = 500
ORE_B.baseMaxAmount = 1500
ORE_B.influences.TECTONIC.type = SIGMOID
ORE_B.influences.TECTONIC.params = 4.0, 2.0, 1.0

ORE_C.naturallyOccurring = true
ORE_C.minPerSite = 1
ORE_C.appearsOn = HARD
ORE_C.baseMinAmount = 500
ORE_C.baseMaxAmount = 1500
ORE_C.influences.VOLCANISM.type = PARABOLIC
ORE_C.influences.VOLCANISM.params = -3.0, 3.0, 0.0

FUMEROLE.naturallyOccurring = true
FUMEROLE.appearsOn = HARD
FUMEROLE.baseMinAmount = 500
FUMEROLE.baseMaxAmount = 1500
FUMEROLE.influences.VOLCANISM.type = LINEAR
FUMEROLE.influences.VOLCANISM.params = 8.0, -0.5